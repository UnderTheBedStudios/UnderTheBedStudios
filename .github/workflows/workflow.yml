name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          plugin_languages: yes
          plugin_calendar: yes
          config_order: languages, calendar
          repositories_skipped: bus-client, lupey-gui-bnm, Lupeylib, Ruined-Monkes, Pete-Hall-Of-Flame, pfmt-reborn, AntiConsoleWalkSimulator
          
